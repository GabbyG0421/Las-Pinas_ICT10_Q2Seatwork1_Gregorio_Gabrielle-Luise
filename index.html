<!DOCTYPE html>
<html lang="en">
<head>


    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght
@400;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarter 2 Seatwork - Dance Club</title>

    <style>
        body{
            background: lightyellow;
            min-height: 100vh;
            font-family: Arial;
        }

        .container{
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .main-card{
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header{
            background: lightpink;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .info-card{
            border: none;
            border-radius: 15px;
            height: 100%;
            transition: transform 0.2s;
        }

        .info-card:hover{
            transform: translateY(-5px);
        }

        .info-title{
            color: lightgreen;
            font-weight: bold;
        }

        .data-value{
            font-size: 1.1rem;
        }

        .badge-custom{
            background-color: lightblue;
        }

        footer{
            text-align: center;
            color: white;
            margin-top: 30px;
        }


    </style>
</head>
<body>
    <header>
        <div class="reactor"></div>
        <h1>Dance Club</h1>
        <p> This club is full of girls.</p>
    </header>

    <main>
        <form>
            <input type="text" id="first_name" placeholder="Enter your First Name"><br>
            <input type="text" id="last_name" placeholder="Enter your Last Name"><br>
            <input type="button" py-click="candidate_checker" value="Enter">
        </form>
        <div id="result"></div>
    </main>
    <py-script src="main.py"></py-script>
</body>
</html>
